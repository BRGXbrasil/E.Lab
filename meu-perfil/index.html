<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fdfbf7">
  <meta name="description" content="Meu Perfil E.lab — uma experiência de cuidado com a e.lab. boutique.">
  <title>Meu Perfil E.lab · e.lab. Boutique</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--paper:#fdfbf7;--ink:#1e120a;--muted:#766b61;--line:#e9e2d8;--sand:#f1ece3;--sand-deep:#e8dfd2;--gold:#a37a35;--gold-pale:#f5eddd;--white:#fffefa;--serif:"Cormorant Garamond",Georgia,serif;--sans:Montserrat,Arial,sans-serif;--shadow:0 18px 60px rgba(45,31,17,.07)}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html{min-height:100%;background:var(--paper)}
    body{margin:0;min-height:100vh;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px}
    button,input,textarea{font:inherit}button{cursor:pointer}
    a{color:inherit}
    .shell{max-width:920px;margin:0 auto;padding:0 22px 36px}
    .topbar{height:76px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
    .wordmark{text-decoration:none;display:flex;align-items:baseline;gap:7px;color:var(--ink)}
    .wordmark strong{font:600 23px var(--serif);letter-spacing:.01em}
    .wordmark span{font:500 9px var(--sans);letter-spacing:.19em;text-transform:uppercase;color:var(--muted)}
    .toplink{font-size:10px;letter-spacing:.1em;text-transform:uppercase;text-decoration:none;color:var(--muted);border-bottom:1px solid var(--sand-deep);padding:8px 0}
    .toplink:hover{color:var(--ink);border-color:var(--gold)}
    .page{max-width:680px;margin:48px auto 0;animation:arrive .36s ease both}
    @keyframes arrive{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
    .intro-row{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:20px}
    .kicker{font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);font-weight:600}
    .counter{font-size:10px;letter-spacing:.12em;color:var(--muted);white-space:nowrap}
    .progress{height:2px;background:var(--sand-deep);width:100%;overflow:hidden;margin:14px 0 0}
    .progress span{height:100%;display:block;background:var(--gold);transition:width .35s ease}
    .card{position:relative;background:var(--white);border:1px solid var(--line);border-radius:4px;padding:clamp(26px,6vw,54px);box-shadow:var(--shadow);overflow:hidden}
    .card:before{content:"";position:absolute;width:150px;height:150px;border-radius:50%;background:var(--sand);opacity:.48;right:-76px;top:-82px}
    .card-content{position:relative;z-index:1}
    .prompt-line{margin:0 0 18px;font:italic 16px var(--serif);color:var(--muted)}
    h1{font:500 clamp(34px,7vw,54px)/.98 var(--serif);letter-spacing:-.025em;margin:0 0 24px;max-width:620px}
    .subcopy{font:400 13px/1.7 var(--sans);color:var(--muted);margin:-10px 0 22px;max-width:520px}
    .prototype-note{border-left:2px solid var(--gold);padding:10px 13px;background:var(--gold-pale);font-size:10px;line-height:1.6;color:#604a26;margin:0 0 20px}
    .field-wrap{margin-top:12px}
    .field-label{display:block;font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:0 0 7px;font-weight:600}
    .field,.textarea{width:100%;border:0;border-bottom:1px solid #cfc4b5;border-radius:0;background:transparent;color:var(--ink);padding:13px 2px;font:400 21px/1.4 var(--serif);outline:none;transition:border-color .2s,box-shadow .2s}
    .field:focus,.textarea:focus{border-color:var(--gold);box-shadow:0 1px 0 var(--gold)}
    .field::placeholder,.textarea::placeholder{color:#b5aaa0;opacity:1}
    .textarea{min-height:116px;resize:vertical}
    .choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:24px}
    .choice{position:relative;text-align:left;min-height:62px;padding:14px 16px;background:var(--paper);border:1px solid var(--line);color:var(--ink);border-radius:3px;font:500 12px/1.5 var(--sans);transition:background .18s,border-color .18s,transform .18s}
    .choice:hover{background:var(--sand);border-color:#d4c6b2;transform:translateY(-1px)}
    .choice:after{content:"↗";position:absolute;right:12px;top:11px;color:var(--gold);font-size:11px}
    .navrow{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:23px}
    .navside{display:flex;align-items:center;gap:10px}
    .text-btn{border:0;background:transparent;color:var(--muted);padding:10px 4px;font-size:10px;letter-spacing:.12em;text-transform:uppercase}
    .text-btn:hover{color:var(--ink)}
    .primary{border:1px solid var(--ink);background:var(--ink);color:#fffdf8;padding:13px 20px;min-height:46px;border-radius:2px;font:600 10px/1.2 var(--sans);letter-spacing:.14em;text-transform:uppercase;transition:background .2s,color .2s,opacity .2s}
    .primary:hover:not(:disabled){background:var(--gold);border-color:var(--gold)}
    .primary:disabled{opacity:.43;cursor:not-allowed}
    .consent-list{display:grid;gap:14px;margin:22px 0}
    .consent{display:grid;grid-template-columns:18px 1fr;gap:12px;align-items:start;padding:14px;border:1px solid var(--line);background:var(--paper);font-size:11px;line-height:1.65;color:#44382d}
    .consent.required{border-color:#d4c29f;background:#fbf7ee}
    .consent input{width:16px;height:16px;margin:1px 0 0;accent-color:var(--ink)}
    .legal-foot{font-size:10px;color:var(--muted);line-height:1.6;margin:16px 0 0}
    .success-mark{width:42px;height:42px;border:1px solid var(--gold);border-radius:50%;display:grid;place-items:center;color:var(--gold);font-size:17px;margin-bottom:20px}
    .footnote{text-align:center;margin:28px 0 0;color:#93877b;font:italic 15px var(--serif)}
    .admin-page{max-width:840px;margin:42px auto 0}
    .admin-page h1{font-size:clamp(34px,6vw,48px);margin:9px 0 12px}
    .admin-note{border:1px solid #d9c59f;background:var(--gold-pale);padding:14px 16px;color:#55411f;font-size:11px;line-height:1.7;margin:18px 0 22px}
    .admin-actions{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}
    .secondary{border:1px solid var(--line);background:var(--white);color:var(--ink);padding:10px 13px;border-radius:2px;font:600 9px var(--sans);letter-spacing:.1em;text-transform:uppercase}
    .secondary:hover{border-color:var(--gold);background:var(--sand)}
    .search{width:100%;padding:13px;border:1px solid var(--line);background:var(--white);font:13px var(--sans);outline:none;margin:8px 0 14px}
    .search:focus{border-color:var(--gold)}
    .profile-list{display:grid;gap:12px}
    .profile-card{border:1px solid var(--line);background:var(--white);box-shadow:0 5px 24px rgba(45,31,17,.035)}
    .profile-head{width:100%;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;text-align:left;border:0;background:transparent;padding:17px 18px;color:var(--ink)}
    .profile-head strong{font:500 24px var(--serif)}
    .profile-head small{display:block;color:var(--muted);font:9px var(--sans);letter-spacing:.08em;margin-top:4px}
    .badges{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px}
    .badge{display:inline-block;border-radius:20px;padding:6px 8px;background:var(--sand);color:#665642;font:600 8px var(--sans);letter-spacing:.08em}
    .badge.gold{background:var(--gold-pale);color:#6b4c17;border:1px solid #e3d3b2}
    .profile-detail{border-top:1px solid var(--line);padding:8px 18px 18px}
    .detail-row{display:grid;grid-template-columns:minmax(130px,.7fr) 1.3fr;gap:14px;border-bottom:1px solid #f0ece5;padding:10px 0;font-size:11px;line-height:1.6}
    .detail-row:last-child{border-bottom:0}
    .detail-label{color:var(--muted);font-size:9px;letter-spacing:.08em;text-transform:uppercase}
    .detail-value{white-space:pre-wrap;overflow-wrap:anywhere}
    .attention{margin:12px 0;padding:12px 13px;border-left:3px solid var(--gold);background:var(--gold-pale);color:#5b451e;font-size:11px;line-height:1.65}
    .empty-state{border:1px dashed var(--line);padding:24px;text-align:center;color:var(--muted);font:italic 17px var(--serif)}
    .message-box{border:1px solid var(--line);background:var(--white);padding:17px;margin:18px 0;font-size:11px;line-height:1.7;color:#554a3e}
    .message-box p{margin:8px 0 12px}
    .hidden{display:none!important}
    @media(max-width:600px){.shell{padding:0 15px 28px}.topbar{height:66px}.page{margin:28px auto 0}.card{padding:26px 20px}.choices{grid-template-columns:1fr}.choice{min-height:56px}.navrow{align-items:flex-end}.navside{gap:7px}.primary{padding:12px 14px}.admin-page{margin-top:28px}.detail-row{grid-template-columns:1fr;gap:3px}.profile-head{padding:15px 13px}.profile-detail{padding:6px 13px 14px}.footnote{margin-top:20px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="wordmark" href="../" aria-label="Voltar ao Hub E.Lab"><strong>e.lab.</strong><span>boutique</span></a>
      <a class="toplink" href="?admin=elab">Recepção</a>
    </header>
    <main id="app" aria-live="polite"></main>
    <p class="footnote">um ritual de cuidado, do seu jeito.</p>
  </div>
  <script>
    const GOOGLE_SHEETS_URL = '';
    const STORAGE_KEY = 'elab_profiles';
    const RECEPCAO_WHATSAPP = '5511993807491';
    const CONSENT_TEXT = 'Autorizo o E.lab Boutique a enviar mensagens sobre meus agendamentos, novidades e cuidados no meu WhatsApp. escolha, escreva ou pula continua valendo, pode desmarcar se preferir.';
    const QUESTIONS = [
      {id:'name', label:'Como prefere ser chamada?', type:'text', placeholder:'Seu nome, do seu jeito'},
      {id:'whatsapp', label:'Seu WhatsApp', type:'tel', placeholder:'(11) 99999-9999'},
      {id:'birthday', label:'Data de aniversário para seu mimo', type:'date'},
      {id:'how_met', label:'Como conheceu o E.lab?', type:'choices', options:['Indicação','Instagram / redes sociais','Já conhecia o E.lab','Outro caminho']},
      {id:'drink', label:'Qual bebida te acompanha?', type:'choices', options:['café especial','chá','água com gás','espumante']},
      {id:'service_style', label:'Como gosta de ser atendida?', type:'choices', options:['mais de conversar','mais quietinha para relaxar']},
      {id:'today', label:'O que você busca hoje? / O que te faz se sentir mais linda? O que você quer transmitir hoje?', type:'textarea', placeholder:'Conte só o que fizer sentido para você…'},
      {id:'self_love', label:'O que você mais ama em você?', type:'textarea', placeholder:'Pode ser uma palavra, uma lembrança ou uma sensação…'},
      {id:'routine', label:'Como é sua rotina real? Rotina em casa e tempo disponível para cuidar', type:'textarea', placeholder:'Na vida real, quanto tempo cabe no seu dia a dia?'},
      {id:'care', label:'Cuidados: Tem alguma sensibilidade, alergia, gestante / amamentando / tratamento, usa medicamento, histórico químico real dos últimos 6 meses?', type:'textarea', placeholder:'Compartilhe somente o que considerar importante para sua experiência.'},
      {id:'highlight', label:'O que você quer realçar?', type:'textarea', placeholder:'O que gostaria de destacar em você?'},
      {id:'products', label:'Quais produtos você usa em casa?', type:'textarea', placeholder:'Se lembrar, pode escrever os nomes ou tipos.'},
      {id:'inspiration', label:'Tem uma inspiração / referência de estilo? Pode escrever ou pular.', type:'textarea', placeholder:'Descreva a referência ou deixe em branco.'}
    ];
    const FIELD_LABELS = [
      ['name','Como prefere ser chamada?'],['whatsapp','Seu WhatsApp'],['birthday','Data de aniversário para seu mimo'],['how_met','Como conheceu o E.lab?'],['drink','Qual bebida te acompanha?'],['service_style','Como gosta de ser atendida?'],['today','O que você busca hoje? / O que te faz se sentir mais linda? O que você quer transmitir hoje?'],['self_love','O que você mais ama em você?'],['routine','Como é sua rotina real? Rotina em casa e tempo disponível para cuidar'],['care','Cuidados'],['highlight','O que você quer realçar?'],['products','Quais produtos você usa em casa?'],['inspiration','Tem uma inspiração / referência de estilo?']
    ];
    const app = document.getElementById('app');
    let step = 0;
    let answers = {};
    let draftId = `p-${Date.now()}-${Math.random().toString(36).slice(2,8)}`;
    let expandedId = 'demo-camila';

    function esc(value){return String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));}
    function localDate(iso){if(!iso)return '';const d=new Date(`${iso}T12:00:00`);return Number.isNaN(d.getTime())?iso:new Intl.DateTimeFormat('pt-BR').format(d);}
    function readProfiles(){try{const data=JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]');return Array.isArray(data)?data:[];}catch{return [];}}
    function writeProfiles(items){localStorage.setItem(STORAGE_KEY,JSON.stringify(items));}
    function demoProfile(){return {id:'demo-camila',createdAt:'2026-11-08T12:00:00.000Z',name:'Camila R.',answers:{name:'Camila R.',whatsapp:'(11) 90000-0000 · exemplo fictício',birthday:'1998-04-12',how_met:'Indicação',drink:'chá',service_style:'mais quietinha para relaxar',today:'Leveza e movimento, com um resultado natural.',self_love:'Meu sorriso.',routine:'Rotina corrida; em casa, consigo alguns minutos para cuidar de mim.',care:'Exemplo fictício: sensibilidade leve no couro cabeludo. Sem alergias informadas. Histórico químico recente descrito para conversa técnica.',highlight:'Textura natural.',products:'Shampoo suave e máscara hidratante.',inspiration:'Ondas naturais, com movimento.'},consentContact:true,consentMarketing:false,consentImage:false,isDemo:true};}
    function ensureDemo(){const profiles=readProfiles();if(!profiles.some(p=>p.id==='demo-camila')){profiles.unshift(demoProfile());writeProfiles(profiles);}}
    function isAdmin(){return new URLSearchParams(location.search).get('admin')==='elab'||location.hash==='#admin';}
    function sheetsSend(payload){if(!GOOGLE_SHEETS_URL)return;try{fetch(GOOGLE_SHEETS_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload),keepalive:true}).catch(()=>{});}catch{}}
    function showProgress(){return `<div class="intro-row"><span class="kicker">experiência de cuidado</span><span class="counter">${String(step+1).padStart(2,'0')} / 14</span></div><div class="progress" aria-label="Progresso"><span style="width:${((step+1)/14)*100}%"></span></div>`;}
    function renderQuestion(){
      const q=QUESTIONS[step];
      const input=q.type==='textarea'
        ? `<div class="field-wrap"><label class="field-label" for="answer">Sua resposta, se quiser</label><textarea class="textarea" id="answer" name="answer" placeholder="${esc(q.placeholder)}">${esc(answers[q.id]||'')}</textarea></div>`
        : q.type==='choices'
          ? `<div class="choices">${q.options.map(option=>`<button class="choice" type="button" data-choice="${esc(option)}">${esc(option)}</button>`).join('')}</div>`
          : `<div class="field-wrap"><label class="field-label" for="answer">${q.type==='date'?'Sua data':'Sua resposta, se quiser'}</label><input class="field" id="answer" name="answer" type="${q.type}" ${q.type==='date'?'':'autocomplete="'+(q.id==='whatsapp'?'tel':'name')+'"'} placeholder="${esc(q.placeholder||'')}" value="${esc(answers[q.id]||'')}"></div>`;
      app.innerHTML=`<section class="page">${showProgress()}<article class="card"><div class="card-content"><p class="prompt-line">escolha, escreva ou pula</p><h1>${esc(q.label)}</h1>${step===0?'<p class="prototype-note">Protótipo de demonstração: as respostas ficam somente neste navegador e não chegam à recepção. Use apenas dados fictícios.</p>':''}${input}<div class="navrow"><div class="navside"><button class="text-btn" type="button" id="back" ${step===0?'disabled':''}>Voltar</button><button class="text-btn" type="button" id="skip">Pular</button></div><button class="primary" type="button" id="next">Continuar</button></div></div></article></section>`;
      document.getElementById('back').addEventListener('click',()=>{if(step>0){step--;renderQuestion();}});
      document.getElementById('skip').addEventListener('click',()=>advance(true));
      document.getElementById('next').addEventListener('click',()=>advance(false));
      app.querySelectorAll('[data-choice]').forEach(button=>button.addEventListener('click',()=>{answers[q.id]=button.dataset.choice;sheetsSend({profileId:draftId,question:q.id,answer:answers[q.id]});step++;renderQuestion();}));
      const field=document.getElementById('answer');
      if(field){field.addEventListener('input',()=>{answers[q.id]=field.value;});field.addEventListener('keydown',event=>{if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();advance(false);}});}
    }
    function advance(skip){const q=QUESTIONS[step];const field=document.getElementById('answer');if(!skip&&field)answers[q.id]=field.value.trim();if(answers[q.id])sheetsSend({profileId:draftId,question:q.id,answer:answers[q.id]});if(step<QUESTIONS.length-1){step++;renderQuestion();}else{step=13;renderConsent();}}
    function renderConsent(){
      const checked=answers.consentContact!==false;
      app.innerHTML=`<section class="page">${showProgress()}<article class="card"><div class="card-content"><p class="prompt-line">escolha, escreva ou pula</p><h1>só mais um cuidado</h1><p class="prototype-note">Protótipo de demonstração: este perfil fica apenas neste navegador. Não use dados reais; a recepção não receberá as respostas.</p><div class="consent-list"><label class="consent required"><input id="consent-contact" type="checkbox" ${checked?'checked':''}><span>${esc(CONSENT_TEXT)}</span></label><label class="consent"><input id="consent-marketing" type="checkbox" ${answers.consentMarketing?'checked':''}><span>Quero receber novidades e convites especiais da e.lab. Boutique.</span></label><label class="consent"><input id="consent-image" type="checkbox" ${answers.consentImage?'checked':''}><span>Autorizo o uso da minha imagem em comunicações da e.lab. Boutique.</span></label></div><p class="legal-foot">Essas informações são só nossas. Usamos para personalizar sua experiência.</p><div class="navrow"><div class="navside"><button class="text-btn" type="button" id="back">Voltar</button><button class="text-btn" type="button" id="skip">Pular</button></div><button class="primary" type="button" id="save">${checked?'Salvar meu perfil E.lab':'autorize para salvar'}</button></div></div></article></section>`;
      const mainConsent=document.getElementById('consent-contact');const save=document.getElementById('save');
      mainConsent.addEventListener('change',()=>{answers.consentContact=mainConsent.checked;save.disabled=!mainConsent.checked;save.textContent=mainConsent.checked?'Salvar meu perfil E.lab':'autorize para salvar';});
      document.getElementById('consent-marketing').addEventListener('change',event=>answers.consentMarketing=event.target.checked);
      document.getElementById('consent-image').addEventListener('change',event=>answers.consentImage=event.target.checked);
      document.getElementById('back').addEventListener('click',()=>{step=12;renderQuestion();});
      document.getElementById('skip').addEventListener('click',()=>{mainConsent.checked=false;answers.consentContact=false;save.disabled=true;save.textContent='autorize para salvar';});
      save.disabled=!checked;save.addEventListener('click',()=>{if(mainConsent.checked)saveProfile(true);});
    }
    function saveProfile(consentContact){
      const record={id:draftId,createdAt:new Date().toISOString(),name:answers.name?.trim()||'Sem nome',answers:{...answers},consentContact:Boolean(consentContact),consentMarketing:Boolean(answers.consentMarketing),consentImage:Boolean(answers.consentImage),isDemo:false};
      const profiles=readProfiles();profiles.unshift(record);writeProfiles(profiles);
      sheetsSend({profileId:record.id,consentContact:record.consentContact,consentMarketing:record.consentMarketing,consentImage:record.consentImage,createdAt:record.createdAt});
      app.innerHTML=`<section class="page"><div class="intro-row"><span class="kicker">experiência de cuidado</span><span class="counter">14 / 14</span></div><div class="progress"><span style="width:100%"></span></div><article class="card"><div class="card-content"><p class="prompt-line">escolha, escreva ou pula</p><div class="success-mark">✓</div><h1>Perfil salvo com carinho.</h1><p class="prototype-note">Nesta demonstração, o perfil foi salvo somente neste navegador. Ele não foi enviado à recepção.</p><div class="navrow"><a class="text-btn" href="../">Voltar ao Hub</a><button class="primary" id="restart" type="button">Começar de novo</button></div></div></article></section>`;
      document.getElementById('restart').addEventListener('click',()=>{step=0;answers={};draftId=`p-${Date.now()}-${Math.random().toString(36).slice(2,8)}`;renderQuestion();});
    }
    function formatConsent(value){return value?'SIM':'NÃO';}
    function fullConsent(value){return `${formatConsent(value)} — ${CONSENT_TEXT}`;}
    function profileSummary(profile){const a=profile.answers||{};return [`Meu Perfil E.lab — ${profile.name||'Sem nome'}`, ...FIELD_LABELS.map(([key,label])=>`${label}: ${a[key]||'—'}`),'Autorização de mensagens: '+fullConsent(profile.consentContact),'Novidades: '+formatConsent(profile.consentMarketing),'Uso de imagem: '+formatConsent(profile.consentImage)].join('\n');}
    function waLink(profile){return `https://wa.me/${RECEPCAO_WHATSAPP}?text=${encodeURIComponent(profileSummary(profile))}`;}
    function csvEscape(value){return `"${String(value??'').replace(/"/g,'""')}"`;}
    function exportCSV(){const profiles=readProfiles();const headers=['Nome','Criado em',...FIELD_LABELS.map(([,label])=>label),'Autorização de mensagens','Texto da autorização','Novidades','Uso de imagem'];const rows=profiles.map(p=>[p.name,p.createdAt,...FIELD_LABELS.map(([key])=>p.answers?.[key]||''),formatConsent(p.consentContact),CONSENT_TEXT,formatConsent(p.consentMarketing),formatConsent(p.consentImage)]);const csv='\ufeff'+[headers,...rows].map(row=>row.map(csvEscape).join(';')).join('\r\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});const link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download='meus-perfis-elab.csv';link.click();URL.revokeObjectURL(link.href);}
    async function copyText(text,button){try{await navigator.clipboard.writeText(text);}catch{const area=document.createElement('textarea');area.value=text;document.body.appendChild(area);area.select();document.execCommand('copy');area.remove();}const old=button.textContent;button.textContent='Copiado';setTimeout(()=>button.textContent=old,1400);}
    function details(profile){const a=profile.answers||{};return `<div class="profile-detail">${profile.isDemo?'<div class="badge gold">EXEMPLO FICTÍCIO</div>':''}${profile.isDemo&&a.care?`<div class="attention"><strong>Ponto de atenção técnica · exemplo fictício</strong><br>${esc(a.care)}</div>`:''}${FIELD_LABELS.map(([key,label])=>`<div class="detail-row"><span class="detail-label">${esc(label)}</span><span class="detail-value">${esc(a[key]||'—')}</span></div>`).join('')}<div class="detail-row"><span class="detail-label">Autorização no WhatsApp</span><span class="detail-value">${esc(fullConsent(profile.consentContact))}</span></div><div class="detail-row"><span class="detail-label">Novidades</span><span class="detail-value">${formatConsent(profile.consentMarketing)}</span></div><div class="detail-row"><span class="detail-label">Uso de imagem</span><span class="detail-value">${formatConsent(profile.consentImage)}</span></div><div class="admin-actions"><a class="secondary" target="_blank" rel="noopener" href="${waLink(profile)}">Enviar no WhatsApp recepção</a><button class="secondary copy-summary" type="button" data-id="${esc(profile.id)}">Copiar resumo</button></div></div>`;}
    function renderAdmin(){
      ensureDemo();const all=readProfiles();
      app.innerHTML=`<section class="admin-page"><span class="kicker">e.lab. boutique · acesso local</span><h1>Painel da recepção</h1><p class="prototype-note">Protótipo local: os perfis ficam somente neste navegador, sem senha e sem sincronização. Qualquer pessoa com acesso a este aparelho pode vê-los. Use apenas dados fictícios; não use informações reais de clientes.</p><div class="admin-actions"><a class="secondary" href="./">Abrir a experiência</a><button class="secondary" id="export" type="button">Exportar CSV</button></div><label class="field-label" for="search">Buscar pelo nome</label><input class="search" id="search" type="search" placeholder="Digite um nome…"><div class="message-box"><span class="kicker">mensagem para enviar 24h depois</span><p id="followup">Amamos te receber! Criei seu Perfil E.lab pra na próxima seu café/chá já estar te esperando e a gente personalizar ainda mais. São 40 segundinhos: ${location.origin}${location.pathname}</p><button class="secondary" id="copy-followup" type="button">Copiar mensagem</button></div><div class="profile-list" id="profile-list"></div></section>`;
      const list=document.getElementById('profile-list');
      function paint(query=''){const matches=readProfiles().filter(p=>(p.name||'').toLocaleLowerCase('pt-BR').includes(query.toLocaleLowerCase('pt-BR')));list.innerHTML=matches.length?matches.map(profile=>`<article class="profile-card"><button class="profile-head" type="button" data-open="${esc(profile.id)}"><span><strong>${esc(profile.name||'Sem nome')}</strong><small>${esc(new Intl.DateTimeFormat('pt-BR',{dateStyle:'short',timeStyle:'short'}).format(new Date(profile.createdAt)))}</small></span><span class="badges">${profile.isDemo?'<span class="badge gold">DEMONSTRAÇÃO</span>':''}${profile.consentContact?'<span class="badge">AUTORIZOU</span>':''}</span></button>${profile.id===expandedId?details(profile):''}</article>`).join(''):'<div class="empty-state">Nenhum perfil por aqui.</div>';list.querySelectorAll('[data-open]').forEach(button=>button.addEventListener('click',()=>{expandedId=expandedId===button.dataset.open?'':button.dataset.open;paint(document.getElementById('search').value);}));list.querySelectorAll('.copy-summary').forEach(button=>button.addEventListener('click',()=>{const profile=readProfiles().find(p=>p.id===button.dataset.id);if(profile)copyText(profileSummary(profile),button);}));}
      paint();document.getElementById('search').addEventListener('input',event=>paint(event.target.value));document.getElementById('export').addEventListener('click',exportCSV);document.getElementById('copy-followup').addEventListener('click',event=>copyText(document.getElementById('followup').textContent,event.currentTarget));
    }
    if(isAdmin()){renderAdmin();}else{renderQuestion();}
  </script>
</body>
</html>
