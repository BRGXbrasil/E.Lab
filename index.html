/* Layout and interaction styles for the operational dashboard. */
:root{--bg:#f9f5ef;--paper:#fff;--ink:#241c17;--muted:#66574b;--line:#e9ded0;--gold:#66574b;--accent-ink:#513927;--pale:#f9f5ef;--shadow:0 2px 12px #241c1708}h1,h2,h3,.serif{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-weight:550}h1{font-size:32px;letter-spacing:-1.2px}h2{font-size:21px;letter-spacing:-.5px}h3{font-size:17px}.shell>div{min-width:0}.sidebar{background:#f9f5ef;overflow-y:auto;padding-top:26px}.sidebar .label{margin-top:22px}nav button{min-height:44px;color:#66574b}.sidebar-bottom{padding-top:14px}.topbar{background:#fffefdf2}.card{border-radius:14px}.btn{min-height:44px;border-radius:9px}.btn.small{min-height:36px}.field{min-height:44px;border-radius:9px;background:#fff}.head{align-items:center}.eyebrow,.label{letter-spacing:1.3px}.stat-number,.mini-stat strong,.ring strong{font-family:inherit;font-weight:550;letter-spacing:-1px}.person-button{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:20px;border:1px solid var(--line);border-radius:14px;background:#fff;text-align:left;min-height:200px;color:var(--ink);transition:border-color .15s}.person-button:hover{border-color:#9e856e}.person-button.present{background:#f9f5ef;border-color:#dbc9b0}.person-button.absent{background:#fff5f2;border-color:#eccfc4}.person-button.pending{border-color:#dfd8bd}.person-button .avatar{width:40px;height:40px}.person-button strong{font-size:15px}.person-button .help{margin:0;line-height:1.5}.people-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.check-row{display:flex;align-items:center;gap:12px;padding:10px;border-bottom:1px solid var(--line);min-height:44px}.check-row input{width:18px;height:18px}.preview-scroll{max-height:320px;overflow:auto;overflow-wrap:anywhere}.error-text{color:var(--red)}.preview-scroll p{white-space:normal;word-break:break-word}.filters>label{display:flex;align-items:center;gap:10px}.row-body{min-width:0;overflow-wrap:anywhere}.form-grid>label{min-width:0}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #795423;outline-offset:3px}.person-button:disabled{cursor:default}.notice{line-height:1.6}.pill{white-space:normal}.form{overflow-wrap:anywhere}@media(max-width:1200px){.people-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
.person-tile{min-width:0}.person-tile>.person-button{width:100%}.person-tile>.actions{margin:8px 0}.person-tile>.actions>.btn{flex:1;font-size:10px;padding:7px}

:root {
  --bg: #f9f5ef;
  --paper: #fffefd;
  --ink: #241c17;
  --bronze: #a67c3d;
  --gold: #795423;
  --muted: #66574b;
  --line: #e9ded0;
  --pale: #f6eee2;
  --accent-ink: #513927;
  --display: "Cormorant Garamond", Georgia, serif;
  --body: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
body { font-family: var(--body); }
h1,h2,h3,.serif,.wordmark {
  font-family: var(--display);
  font-weight: 400;
}
h1 { font-size: clamp(34px,4vw,47px); line-height: 1; }
h2 { font-size: 29px; }
h3 { font-size: 23px; }
.wordmark { font-size: 37px; line-height: 1; letter-spacing: -.035em; }
.wordmark span { font: 400 10px/2 var(--body); letter-spacing: .28em; margin: 5px 0 0 2px; }
.sidebar { background: var(--ink); color: var(--bg); border-color: #3e3127; }
.sidebar>.wordmark::after { content: ""; display: block; width: 42px; height: 1px; margin: 16px 0 5px; background: var(--bronze); }
.sidebar .label, .sidebar .wordmark span { color: #ddbf8e; }
.sidebar-bottom { color: #d4c5b7; border-color: #493a2e; }
.sidebar nav button { color: #f3eae0; }
.sidebar nav button:hover { background: #382b22; }
.sidebar nav button.active, .sidebar nav button.active:hover {
  background: #493727;
  color: var(--paper);
  box-shadow: inset 2px 0 var(--bronze);
}
.sidebar nav button.active .navicon { color: #ddbf8e; }
.topbar { background: #fffefdf2; border-bottom-color: #a67c3d40; }
.eyebrow,.label { color: var(--gold); }
.head .eyebrow { letter-spacing: .19em; }
.head h1::after { content: ""; display: block; height: 1px; width: 48px; margin-top: 12px; background: var(--bronze); }
.btn.primary { background: var(--ink); border-color: var(--ink); }
.day-progress, .ring::before { background: var(--pale); }
.ring { background: conic-gradient(var(--bronze) calc(var(--pct)*1%), #e6d8c4 0); }
.person-button.present, .pill.green { background: var(--pale); }
::selection { color: var(--ink); background: #a67c3d33; }

.mini-stat h2{font-size:clamp(.85rem,2vw,1.1rem);letter-spacing:normal;margin:0}

/* Small-screen layout. Wider displays opt into the sidebar and comparison tables. */
.shell { display: block; min-height: 100dvh; }
.sidebar {
  position: sticky;
  z-index: 5;
  top: 0;
  height: auto;
  padding: 0;
  overflow: visible;
  border-right: 0;
  border-bottom: 1px solid #493a2e;
}
.mobile-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 14px; }
.mobile-header .wordmark { display: block; font-size: 23px; }
.mobile-header .wordmark span { font-size: 9px; }
.menu-toggle { display: inline-flex; min-width: 76px; min-height: 44px; }
.sidebar-bottom, .sidebar nav { display: none; }
.sidebar.menu-open nav {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 6px;
  max-height: calc(85dvh - 60px);
  overflow: auto;
  padding: 6px 10px 12px;
}
.sidebar nav button { width: 100%; min-height: 44px; font-size: .875rem; white-space: normal; }
.topbar { min-height: 52px; height: auto; padding: 8px 14px; gap: 8px; }
.user > div:not(.avatar) { display: none; }
main { padding: 16px 12px 32px; }
.card { min-width: 0; padding: 14px; }
.head, .card-head { gap: 10px; flex-wrap: wrap; }
.head { flex-direction: column; align-items: flex-start; margin-bottom: 16px; }
.card-head { margin-bottom: 14px; }
.grid, .grid.equal, .grid.three, .hero, .form-grid { grid-template-columns: minmax(0, 1fr); gap: 12px; }
.stack { gap: 12px; }
.metric-grid, .people-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.metric-grid h2 { font-size: 1.375rem; }
.person-button { min-height: 96px; padding: 10px; align-content: center; text-align: left; }
.presence-time { font-variant-numeric: tabular-nums; color: var(--muted); font-size: .875rem; }
.mini-stats { padding: 4px; min-height: 0; grid-template-columns: repeat(3,minmax(0,1fr)); }
.mini-stat { padding: 8px 5px; }
.mini-stat h2 { font-size: .78rem; }
.mini-stat p, .help, .row p, .meta { font-size: .8rem; }
.mini-stat strong { margin: 4px 0; }
.filters { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 8px; align-items: end; }
.filters > label { display: block; min-width: 0; }
.filters .field { width: 100%; min-width: 0; font-size: 1rem; }
.filters input[type="search"], .filters #search { grid-column: 1 / -1; }
.field { min-width: 0; max-width: 100%; font-size: 1rem; }

const normalizedName = value => String(value || '').trim().normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/\s+/g, ' ');
function isOperationalName(name) {
  return normalizedName(name).split(' ')[0] !== 'diego';
}
function isOperationalStaff(staff) {
  return staff.active && staff.operational !== false && isOperationalName(staff.name);
}


function performanceReport(records, from, to, professional = '') {
  const history = records.filter(r => r.kind === 'avec_service' && r.data?.normalized?.date);
  const selected = history.filter(r => {
    const d = r.data.normalized;
    return d.date >= from && d.date <= to && (!professional || d.professional === professional);
  });
  const visits = new Map();
  const clients = new Map();
  const professionals = new Map();
  let services = 0;
  let amountCents = 0;
  let unidentifiedRows = 0;
  for (const r of history) {
    const d = r.data.normalized;
    if (!d.client?.trim()) continue;
    const key = (r.data.unit || 'E.Lab') + '/' + normalizedName(d.client);
    const client = clients.get(key) || {key, name:d.client, dates:new Set(), visits:new Set(), total:0, selectedVisits:new Set(), selectedAmount:0, services:0};
    if (d.date <= to) {
      client.dates.add(d.date);
      client.visits.add([r.data.unit,d.date,d.command || r.id].join('/'));
      client.total += Number(d.amountCents) || 0;
    }
    clients.set(key,client);
  }
  for (const r of selected) {
    const d = r.data.normalized;
    const visit = [r.data.unit || 'E.Lab',d.date,d.command || r.id].join('/');
    const clientKey = (r.data.unit || 'E.Lab') + '/' + normalizedName(d.client);
    services += Number(d.quantity) || 0;
    amountCents += Number(d.amountCents) || 0;
    visits.set(visit,true);
    const person = professionals.get(d.professional) || {name:d.professional || 'Sem profissional informado',services:0,amountCents:0,visits:new Set(),clients:new Set()};
    person.services += Number(d.quantity) || 0;
    person.amountCents += Number(d.amountCents) || 0;
    person.visits.add(visit);
    if (d.client?.trim()) {
      person.clients.add(clientKey);
      const client = clients.get(clientKey);
      client.selectedVisits.add(visit);
      client.selectedAmount += Number(d.amountCents) || 0;
      client.services += Number(d.quantity) || 0;
    } else unidentifiedRows++;
    professionals.set(d.professional,person);
  }
  const portfolio = [...clients.values()].filter(c=>c.dates.size).map(c=>{
    const dates=[...c.dates].sort();
    const first=dates[0],last=dates.at(-1);
    const daysSince=Math.floor((Date.parse(to+'T12:00:00Z')-Date.parse(last+'T12:00:00Z'))/86400000);
    return {...c,first,last,daysSince,visits:c.visits.size,selectedVisits:c.selectedVisits.size,
      classification:c.visits.size>1?'Recorrente':'Primeira vez',
      returning:c.selectedVisits.size>0&&(first<from||c.selectedVisits.size>1)};
  }).filter(c=>!professional||c.selectedVisits>0);
  const attended=portfolio.filter(c=>c.selectedVisits>0);
  return {services,amountCents,visits:visits.size,ticketCents:visits.size?Math.round(amountCents/visits.size):null,
    clients:attended.length,returning:attended.filter(c=>c.returning).length,
    firstObserved:attended.filter(c=>c.first>=from).length,unidentifiedRows,portfolio,
    professionals:[...professionals.values()].map(p=>({...p,clients:p.clients.size,visits:p.visits.size,ticketCents:p.visits.size?Math.round(p.amountCents/p.visits.size):null})).sort((a,b)=>b.services-a.services)};
}

function canViewIndicators(user){return Boolean(user&&!user.testAccess&&!user.temporaryReadOnly&&['admin','manager','reception','commercial'].includes(user.role))}

const {performanceOverview,individualPerformance}=(()=>{
// This report describes observed AVEC service history, not payment settlement.
function performanceOverview(records, from, to, professional = '') {
  const validDate = value => typeof value === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(value) && Number.isFinite(Date.parse(value)) && new Date(value).toISOString().slice(0,10) === value;
  const history = records.filter(r => {
    const d = r?.data?.normalized;
    return r?.kind === 'avec_service' && d && (!r.data.source || r.data.source === '0031') && (d.client == null || typeof d.client === 'string') && (d.professional == null || typeof d.professional === 'string') && validDate(d.date) && typeof d.quantity === 'number' && Number.isFinite(d.quantity) && d.quantity > 0 && Number.isSafeInteger(d.amountCents);
  }).map(r => r.data.normalized.professional ? r : {...r,data:{...r.data,normalized:{...r.data.normalized,professional:'Não informado na origem'}}});
  const rangeValid = validDate(from) && validDate(to) && from <= to;
  const selected = rangeValid ? history.filter(r => r.data.normalized.date >= from && r.data.normalized.date <= to && (!professional || r.data.normalized.professional === professional)) : [];
  const base = performanceReport(rangeValid ? history : [], from, to, professional);
  const months = new Map(), categories = new Map(), serviceMix = new Map(), visits = new Map(), professionalMonths = new Map();
  if (rangeValid) for (let cursor = new Date(from.slice(0,7)+'-01T12:00:00Z'); cursor <= new Date(to+'T12:00:00Z'); cursor.setUTCMonth(cursor.getUTCMonth()+1)) {
    const month = cursor.toISOString().slice(0,7);
    months.set(month,{month,services:0,amountCents:0});
  }
  const add = (map, name, d) => {
    const group = map.get(name) || {name,services:0,amountCents:0};
    group.services += d.quantity;
    group.amountCents += d.amountCents;
    map.set(name,group);
  };
  for (const r of selected) {
    const d = r.data.normalized, month = months.get(d.date.slice(0,7));
    month.services += d.quantity; month.amountCents += d.amountCents;
    add(categories,String(d.category || '').trim() || 'Sem categoria informada',d);
    add(serviceMix,String(d.service || '').trim() || 'Sem serviço informado',d);
    const person = professionalMonths.get(d.professional) || new Map();
    const personMonth = person.get(d.date.slice(0,7)) || {services:0,amountCents:0};
    personMonth.services += d.quantity; personMonth.amountCents += d.amountCents;
    person.set(d.date.slice(0,7),personMonth);professionalMonths.set(d.professional,person);

  }

  const dates = history.map(r => r.data.normalized.date).sort();
  return {...base,months:[...months.values()],categories:sorted(categories),serviceMix:sorted(serviceMix),
    professionals:base.professionals.map(p => {
      const person = performanceReport(history,from,to,p.name);
      return {...p,firstObserved:person.firstObserved,returning:person.returning,
        months:[...months.keys()].map(month=>({month,...(professionalMonths.get(p.name)?.get(month) || {services:0,amountCents:0})}))};
    }),
    singleVisitClients:attended.filter(c => c.selectedVisits === 1).length,
    recurringClients:attended.filter(c => c.selectedVisits > 1).length,
    atRiskClients:attended.filter(c => c.daysSince > 60).length,
    singleServiceVisits:[...visits.values()].filter(quantity => quantity === 1).length,
    excludedRows:records.length-history.length,coverageFrom:dates[0] || null,coverageTo:dates.at(-1) || null};
}

    const d = r?.data?.normalized;

  const previousFrom = rangeValid ? shift(from,-((dateNumber(to)-dateNumber(from))/day+1)) : null;
  const current = performanceOverview(records,from,to,professional);
  const previous = performanceOverview(records,previousFrom,previousTo,professional);

  for (const r of rangeValid ? history : []) {
    const d = r.data.normalized;
    const coveredThrough = d.date > to ? to : d.date;
    if (!coverageTo || coveredThrough > coverageTo) coverageTo = coveredThrough;
    if (d.date > to) continue;
    if ((professional && d.professional !== professional) || !d.client?.trim()) continue;
    const unit = r.data.unit || 'E.Lab';
    const key = unit+'/'+normalize(d.client);

async function refreshPanelBoard(renderNow=true){

 if(!mondayBoardVisible||s.boardBusy||!session||session.temporaryReadOnly)return;

 finally{if(rev===assistantEpoch){s.boardBusy=false;if(renderNow||!document.querySelector('#panelAssistantInput:focus'))render()}}
}
async function sendPanelChat(mode='message',itemId=''){
 const s=assistantState,rev=assistantEpoch;
 if(s.busy||!session||session.temporaryReadOnly)return;
 const last=s.history.at(-1);
 const query=mode==='web'?last?.query:mode==='monday'?last?.query:document.querySelector('#panelAssistantInput')?.value.trim();
 if(!query)return;
 s.busy=true;if(mode==='message')s.draft=query;render();
 let answer;
 try{
  answer=mode==='monday'?await request('/api/panel-monday',{action:'confirm-complete',itemId}):await request('/api/panel-assistant',{message:query,area,web:mode==='web'});
  if(rev!==assistantEpoch)return;
  if(answer.record){records=[answer.record,...records.filter(r=>r.id!==answer.record.id)];await refresh(false).catch(()=>{})}
  if(answer.kind==='monday-saved'||answer.kind==='monday-already')await refreshPanelBoard();
  if(rev!==assistantEpoch)return;
  if(mode==='message')s.draft='';
 }catch(err){answer={kind:'error',message:err.message}}
 finally{
  if(rev===assistantEpoch){
   s.busy=false;s.history=[...s.history,{query:mode==='web'?'Buscar orientação externa':mode==='monday'?'Confirmar conclusão no Monday':query,answer}].slice(-8);
   render();
  }
 }
}

let procedureSector = '';
const normalizeProcedure = value => value.normalize('NFD').replace(/\p{Diacritic}/gu, '').toLowerCase().trim();

function procedureFavorites() {
  try {
    const saved = JSON.parse(localStorage.getItem('elab-procedure-favorites:' + (assistantIdentity||session.id)) || '[]');
    return new Set(Array.isArray(saved) ? saved : []);
  } catch {
    return new Set();
  }
}

function toggleProcedureFavorite(id) {
  const favorites = procedureFavorites();
  if (favorites.has(id)) favorites.delete(id);
  else favorites.add(id);
  localStorage.setItem('elab-procedure-favorites:' + (assistantIdentity||session.id), JSON.stringify([...favorites]));
  render();
}

// Match situations with a procedure only when the query includes the defining facts.
function procedureSituation(value) {
  const query = normalizeProcedure(value);
  if (!value.includes('?') && query.split(/\s+/).length < 6) return null;
  const scenarios = [
    ['espera', /client/, /atras|espera|demor/],
    ['agendamento', /agend|remarc|encaix/, /horario|prefer|client|agenda/],
    ['listadavez', /vez|fila/, /ausent|faltou|presen|ocupad|encaix/],
    ['caixa', /caixa|comprovante/, /fech|diverg|confer/],
    ['cadastro', /cadastr/, /client|telefone|dados/],
    ['revenda', /revend|produto/, /indic|recomend/],
  ];
  const matches = scenarios.filter(([, subject, condition]) => subject.test(query) && condition.test(query));
  return {id: matches.length === 1 ? matches[0][0] : undefined};
}

 if(!force&&stockLoadedStamp===stamp)return;
 stockLoadState='loading';stockLoadError='';if(['inventory','replenishment'].includes(view)&&!dialog.open)render();
 const flight=(async()=>{try{const next=await request('/api/replenishment');stockState=next;stockLoadedStamp=stamp;stockLoadState='ready'}catch(err){stockLoadState='error';stockLoadError=err.message;throw err}finally{stockLoadFlight=null;if(['inventory','replenishment'].includes(view)&&!dialog.open)render()}})();stockLoadFlight=flight;return flight;

function inventoryPage(){
 if(!stockState.orderReport && (importedStockCatalog().length||byKind('inventory').length))return legacyStockPage();
 return stockOrderPage()+stockCatalogAndTrace()+(byKind('inventory').length?`<details class="card" data-detail-key="stock-local-products" style="margin-top:24px"><summary>Produtos locais</summary>${localInventoryPage(true)}</details>`:'');
}
function legacyStockPage(){
 const all=importedStockCatalog(),source=avecSummary.stock||{},local=byKind('inventory'),snapshots=all.filter(p=>p.snapshot),latest=[source.to,...all.map(p=>p.snapshot?.date||p.to)].filter(Boolean).sort().at(-1),loading=stockLoadState==='loading'||(!all.length&&stockLoadedStamp===null&&stockLoadState==='idle');
 const known=all.filter(p=>p.snapshot&&p.balanceVerified!==false&&Number.isFinite(p.inputs?.minimum??(p.minimumKnown?p.snapshot.minimum:undefined))),unknown=all.length-known.length,critical=known.filter(p=>!p.singleUnusedReserve&&p.replenishmentEnabled!==false&&p.onHand<=(p.inputs?.minimum??p.snapshot.minimum)).length+local.filter(r=>r.data.quantity<=r.data.minimum).length;
 const expiryRefs=[];for(const p of all)for(const date of new Set(p.expiryReferences||[]))expiryRefs.push({date,product:p.key});for(const r of local)if(r.data.expiry)expiryRefs.push({date:r.data.expiry,product:r.id});const reviewed=all.length>0&&all.every(p=>p.validityStatus==='ok'),positionsKnown=all.length>0&&all.every(p=>p.balanceKnown||p.snapshot&&p.balanceVerified!==false);const due=expiryRefs.filter(r=>r.date<=addDays(businessDate(),30)),products=(all.length||source.products||0)+local.length,trace=stockState.traceCount??stockState.movementCount??source.rows??0;
 return summary('Estoque','',btn('stock-refresh',stockLoadState==='loading'?'Atualizando…':'Atualizar estoque','','primary')+(management()?btn('inventory','＋ Produto local'):''))+`<div class="metric-grid"><section class="card" data-stock-metric="products"><div class="label">Produtos</div><div class="stat-number">${products|| (loading?'…':0)}</div><p class="help">${all.length||source.products||0} no catálogo AVEC · ${local.length} cadastrados manualmente</p></section><section class="card" data-stock-metric="${stockState.orderReport?'minimum':'replenishment'}"><div class="label">${stockState.orderReport?'Saldo no mínimo ou abaixo':'Reposição'}</div><div class="stat-number">${critical|| (unknown?'A conferir':loading?'…':0)}</div><p class="help">${unknown?unknown+(positionsKnown?' aguardam mínimo':' aguardam saldo ou mínimo'):critical?known.filter(p=>!p.singleUnusedReserve&&p.replenishmentEnabled!==false&&p.onHand<(p.inputs?.minimum??p.snapshot.minimum)).length+' abaixo · '+known.filter(p=>!p.singleUnusedReserve&&p.replenishmentEnabled!==false&&p.onHand===(p.inputs?.minimum??p.snapshot.minimum)).length+' no mínimo':'itens com saldo e mínimo conferidos'}</p>${critical?btn('stock-filter','Listar itens','alerts','small'):''}</section><section class="card" data-stock-metric="expiry"><div class="label">Validade</div><div class="stat-number">${reviewed?'OK':expiryRefs.length?due.length:loading?'…':'A informar'}</div><p class="help">${reviewed?all.length+' produtos conferidos · '+e(safeTime(stockState.settings?.validity?.reviewedAt)) :expiryRefs.length?'referências de validade vencidas ou em até 30 dias nos arquivos':'datas de validade ainda não informadas'}</p></section><section class="card" data-stock-metric="trace"><div class="label">Rastreabilidade</div><div class="stat-number">${trace|| (loading?'…':0)}</div><p class="help">${stockState.currentState?'movimentos, posições e cadastros com origem':'movimentos importados com arquivo, linha e autoria'}</p></section></div><div class="notice">${stockState.currentState?'Posição recebida em '+fmtDate(stockState.currentState.receivedAt)+'. Data de emissão não informada no arquivo. ':latest?'Dados de estoque até '+fmtDate(latest)+'. ':''}${stockState.currentState?'Os relatórios atuais são a referência de saldo e mínimo, sem somar novamente os movimentos históricos. ':stockState.settings?.positionBasis==='movements'?'Posição atual calculada pelas entradas, saídas e ajustes de cada produto, por medida. ':snapshots.length?snapshots.length+' posições de saldo importadas. ':'O arquivo contém movimentos; saldo disponível e reposição precisam de posição inicial ou contagem e mínimo. '}${reviewed?'Validade atual conferida e registrada como OK; datas históricas permanecem disponíveis para consulta.':expiryRefs.length?'As datas de validade são referências históricas do arquivo; confirme quais lotes permanecem disponíveis.':''}</div>${stockLoadState==='error'?`<div class="notice error" role="alert">Não foi possível atualizar o estoque: ${e(stockLoadError)}. Os dados anteriores foram preservados. Use Atualizar estoque para tentar novamente.</div>`:''}${loading?'<div class="notice" role="status">Carregando produtos…</div>':''}${stockState.currentState&&management()?`<div class="notice">Valor de custo do estoque: <strong>${money(stockState.currentState.summary.costTotalCents)}</strong> · valor de venda cadastrado: ${money(stockState.currentState.summary.saleTotalCents)}.</div>`:''}${stockActivitySection()}${stockHistorySection()}<details class="card" style="margin-top:24px"><summary>Cadastros e saldos locais (${local.length})</summary><p class="help">Contagens e produtos registrados diretamente neste painel.</p>${localInventoryPage(true)}</details>`;
}

function stockActivitySection(){const all=importedStockCatalog(),q=search.toLowerCase(),filtered=all.filter(p=>stockListFilter==='all'||stockListFilter==='alerts'&&p.needsReplenishment||stockListFilter==='below'&&p.needsReplenishment&&p.onHand<(p.inputs?.minimum??p.minimum)||stockListFilter==='at'&&p.needsReplenishment&&p.onHand===(p.inputs?.minimum??p.minimum)).filter(p=>!q||[p.name,p.brand,p.category,p.line,p.barcode].filter(Boolean).join(' ').toLowerCase().includes(q)),max=Math.max(0,Math.ceil(filtered.length/50)-1);stockPage=Math.min(stockPage,max);const pending=stockLoadState==='loading'||(stockLoadState==='idle'&&stockLoadedStamp===null);return `<section class="card" id="stockImportedList" style="margin-top:24px"><div class="card-head"><div><h2>Produtos</h2><p>${stockState.movementCount||0} linhas de movimentos · ${all.length} produtos carregados</p></div></div><div class="notice">${stockState.currentState?'Posições e mínimos informados nos relatórios atuais. O histórico anterior já está contemplado e não é somado outra vez.':stockState.settings?.positionBasis==='movements'?'Posição atual = entradas − saídas + ajustes, mantendo cada medida separada. Reposição depende dos mínimos e prazos cadastrados.':'Entradas, saídas e ajustes preservam a medida original. A variação abaixo não é o saldo disponível. Quando houver relatório de saldo, a posição e sua data aparecem no produto; reposição depende também do mínimo e dos prazos.'}</div><div class="actions">${[['all','Todos'],['alerts','No mínimo ou abaixo'],['below','Abaixo'],['at','Exatamente no mínimo']].map(([id,l])=>btn('stock-filter',l,id,stockListFilter===id?'primary small':'small')).join('')}${btn('stock-alert-export','Exportar lista de alertas','','small')}</div><input id="search" class="field" placeholder="Buscar produto" value="${e(search)}">${filtered.slice(stockPage*50,stockPage*50+50).map(p=>`<div class="row"><div class="row-body"><strong>${e(p.name)}</strong><p>${e(p.unit||'E.Lab')}${p.rows?' · '+p.rows+' registros · '+fmtDate(p.from)+' a '+fmtDate(p.to):''}</p>${p.balanceKnown&&!p.snapshot?`<p><strong>Posição atual: ${p.positions.map(v=>v.quantity+' '+e(v.unit)).join(' · ')}</strong></p>`:''}${p.validityStatus==='ok'?`<p>${pill('done','Validade OK')} · conferida ${e(safeTime(p.validityReviewedAt))}</p>`:''}${p.catalogueSource==='current-reports'?`<p><strong>Posição atual: ${e(p.quantityText)}</strong></p><p>Saldo absoluto ${p.absoluteQuantity} unidades · mínimo ${p.minimum} ${e(p.minimumUnit)}</p><p>${e([p.brand,p.line,p.category].filter(Boolean).join(' · '))}${p.barcode?' · código '+e(p.barcode):''}</p><p>Medida/capacidade informada: ${p.capacity} · recebido ${fmtDate(p.receivedAt)}</p>${p.singleUnusedReserve?'<p>Uma unidade sem saídas no histórico disponível: reserva suficiente, sem reposição.</p>':''}${p.historyVariantAmbiguity?'<p>O histórico por nome não distingue as duas linhas deste produto.</p>':''}`:p.snapshot?`<p><strong>Saldo do arquivo ${p.snapshot.quantity} ${e(p.snapshot.unit)}</strong> · ${fmtDate(p.snapshot.date)}</p>${p.balanceVerified===false?'<p>Saldo e movimentos precisam de conciliação para determinar a disponibilidade.</p>':`<p>Saldo calculado ${p.onHand} ${e(p.snapshot.unit)}${p.activity?.to?' · movimentos até '+fmtDate(p.activity.to):''}</p>`}<p>Mínimo ${p.inputs?.minimum??(p.minimumKnown?p.snapshot.minimum:'a definir')}</p>`:''}${p.expiryReferences?.length?`<p>Datas históricas do arquivo: ${p.expiryReferences.slice(0,3).map(fmtDate).join(', ')}${p.expiryReferences.length>3?' · mais '+(p.expiryReferences.length-3):''}</p>`:''}${Object.entries(p.measures||{}).map(([unit,m])=>`<p>${e(unit)}: entradas ${m.in} · saídas ${m.out} · ajustes ${m.adjustment} · variação ${m.net}</p>`).join('')}</div>${p.catalogueSource==='current-reports'?pill(p.needsReplenishment?'partial':'done',p.needsReplenishment?'Repor':p.singleUnusedReserve?'Reserva suficiente':p.replenishmentEnabled?'Acima do mínimo':'Mínimo desativado'):p.snapshot?pill(p.balanceVerified===false?'partial':'',p.balanceVerified===false?'Conciliação pendente':'Saldo do relatório'):p.balanceKnown?pill('done','Posição calculada'):pill('pending','Saldo a conferir')}${p.positionOrigin?btn('avec-detail','Posição',p.positionOrigin,'small')+btn('avec-detail','Cadastro',p.productOrigin,'small'):''}${p.rows?btn('avec-product','Ver movimentos',JSON.stringify([p.ledgerProductId||p.productId,p.unit||'E.Lab']),'small'):''}</div>`).join('')||(pending?'':stockLoadState==='error'?empty('Os produtos serão exibidos quando a conexão for restabelecida.'):empty(q?'Nenhum produto corresponde à busca.':'Nenhum produto disponível. Confira a Central AVEC.'))}<div class="actions">${stockPage>0?btn('avec-stock-page','Anterior',String(stockPage-1)):''}<span class="help">Página ${stockPage+1} de ${max+1}</span>${stockPage<max?btn('avec-stock-page','Próxima',String(stockPage+1)):''}</div></section>`}

async function avecDetails(id){const r=await request('/api/import-row?id='+encodeURIComponent(id)),d=r.data;modal('Registro e origem',`<p class="meta">${e(d.source)} · ${e(d.unit)}${d.row?' · linha '+d.row:''}</p>${d.fileId?`${btn('import-file-download','Baixar original',d.fileId)}`:''}<div class="divider"></div>${Object.entries(d.raw||d.normalized).map(([k,v])=>`<div class="row"><div class="row-body"><strong>${e(k)}</strong><p>${e(Array.isArray(v)?v.join(', '):v??'Não informado')}</p></div></div>`).join('')}`,'Fechar',async()=>{})}
async function avecProduct(id,unit,offset=0){const data=await request('/api/stock-ledger?productId='+encodeURIComponent(id)+'&unit='+encodeURIComponent(unit)+'&offset='+offset);modal('Movimentos do produto',`<p class="help">${data.total} registros de origem. Medidas não são convertidas entre embalagens.</p>${data.rows.map(r=>{const d=r.data.normalized;return `<div class="row"><div class="row-body"><strong>${e(d.product)}</strong><p>${fmtDate(d.date)} · ${e(d.quantityText||d.quantity+' '+d.unit)}</p><p>${e(d.reason)} · ${e(d.responsible||r.updatedBy)}</p></div>${btn('avec-detail','Origem',r.id,'small')}</div>`}).join('')}<div class="actions">${offset>0?btn('avec-ledger-prev','Anteriores',JSON.stringify([id,unit,Math.max(0,offset-50)])):''}${data.hasMore?btn('avec-ledger-next','Próximos',JSON.stringify([id,unit,offset+50])):''}</div>`,'Fechar',async()=>{})}
async function prepareNativeImport(){const d=uploadDraft;if(['stock-position','stock-products'].includes(d.source)&&[importState.activeCatalog?.data.positionFileId,importState.activeCatalog?.data.productFileId].includes(d.file.id)&&(importState.activeCatalog?.data.unit||'E.Lab')===d.unit)throw Error('Este arquivo já está ativo no estoque; selecione uma nova versão para atualizar.');const rows=await compileAvecRows(d.source,d.sheets[0].rows[0],d.sheets[0].rows.slice(1));d.native=true;const outcomes=[];for(let i=0;i<rows.length;i+=10){const r=await request('/api/import-preview',{native:true,source:d.source,unit:d.unit,fileId:d.file.id,rows:rows.slice(i,i+10)});outcomes.push(...r.outcomes)}importPreview={rows,outcomes};previewModal()}
async function avecAction(a,id){if(a==='import-file-download'){const response=await apiFetch('/api/import-file?id='+encodeURIComponent(id));if(!response.ok)throw Error('Não foi possível baixar o arquivo.');const link=document.createElement('a');link.href=URL.createObjectURL(await response.blob());link.download='importacao-'+id;link.click();setTimeout(()=>URL.revokeObjectURL(link.href),1000);return true}if(a==='performance-print'){window.print();return true}if(a==='stock-order-page'){orderPage=Number(id);render();return true}if(a==='stock-order-export'&&stockState.orderReport){
  const report=stockState.orderReport;
  downloadCSV([['Produto','Unidade','Saldo histórico','Data do saldo','Saldo projetado hoje','Consumo diário','Cobertura dias','Prazo entrega','Saldo na chegada','Cobertura após chegada','Quantidade sugerida','Validação','Situação'],
    ...stockOrderRows(report).map(row=>[row.name,row.unit,row.balance,row.balanceDate,row.projectedBalance,row.daily,row.coverageDays,row.leadDays,row.projectedBalanceAtArrival,row.postArrivalDays,row.orderUnits,row.quantityReason,orderStatusLabels[row.status]])],'elab-reposicao-'+report.date+'.csv');
  return true;
 }if(a==='result-professional'){resultProfessional=id||'';avecResultTab='services';avecPage=0;search='';render();return true}if(a==='stock-filter'){stockListFilter=id;stockPage=0;search='';render();return true}if(a==='stock-alert-export'){const items=importedStockCatalog().filter(p=>p.needsReplenishment);downloadCSV([['Produto','Marca','Linha','Posição','Saldo para comparação','Medida','Mínimo','Situação'],...items.map(p=>[p.name,p.brand,p.line,p.quantityText,p.onHand,p.minimumUnit,p.minimum,p.onHand<p.minimum?'Abaixo do mínimo':'Exatamente no mínimo'])],'estoque-alertas.csv');return true}if(a==='stock-catalog-activate'){const [positionFileId,productFileId,unit]=JSON.parse(id);await request('/api/stock-catalog-activate',{positionFileId,productFileId,unit,revision:importState.activeCatalog?.revision||0});stockLoadedStamp=null;await refresh();toast('Posição e cadastro de estoque ativados em conjunto.');return true}if(a==='stock-refresh'){await refreshFeatures(true);render();toast('Estoque atualizado com os dados importados.');return true}if(a==='avec-tab'){avecResultTab=id;avecPage=0;search='';render();return true}if(a==='avec-page'){avecPage=Number(id);render();return true}if(a==='avec-stock-page'){stockPage=Number(id);render();return true}if(a==='avec-detail'){await avecDetails(id);return true}if(a==='avec-product'){const [product,unit]=JSON.parse(id);await avecProduct(product,unit);return true}if(['avec-ledger-next','avec-ledger-prev'].includes(a)){const [product,unit,offset]=JSON.parse(id);await avecProduct(product,unit,Number(offset));return true}return false}
app.addEventListener('change',ev=>{if(ev.target.name==='resultProfessional'){resultProfessional=ev.target.value;avecPage=0;render()}if(ev.target.name==='financialBasis'){financialBasis=ev.target.value;avecPage=0;render()}});

function stockHistorySection(){const rows=stockState.historicalOnly||[];if(!rows.length)return '';return `<details class="card" style="margin-top:20px"><summary>Produtos somente no histórico (${rows.length})</summary><p class="help">Não constam nos dois relatórios atuais; seus registros anteriores continuam preservados.</p>${rows.map(p=>`<div class="row"><div class="row-body"><strong>${e(p.name)}</strong><p>${p.rows} movimentos anteriores</p></div>${btn('avec-product','Histórico',JSON.stringify([p.productId,p.unit]),'small')}</div>`).join('')}</details>`}

function stockCandidatesPanel(){const list=importState.stockCandidates||[],positions=list.filter(r=>r.data.source==='stock-position'),products=list.filter(r=>r.data.source==='stock-products');if(!positions.length&&!products.length)return '';const active=importState.activeCatalog?.data;return `<section class="card" style="margin-top:24px"><h2>Consolidação dos relatórios de estoque</h2><p class="help">A posição atual é preservada até a ativação conjunta. Selecione dois relatórios completos da mesma unidade.</p>${positions.map(p=>products.filter(m=>m.data.unit===p.data.unit).map(m=>`<div class="row"><div class="row-body"><strong>${e(p.data.unit)}</strong><p>${p.data.rows} posições · ${m.data.rows} cadastros e mínimos</p></div>${active?.positionFileId===p.data.fileId&&active?.productFileId===m.data.fileId&&(active?.unit||'E.Lab')===p.data.unit?pill('done','Ativo'):btn('stock-catalog-activate','Conferir e ativar',JSON.stringify([p.data.fileId,m.data.fileId,p.data.unit]),'small primary')}</div>`).join('')).join('')||empty('Aguardando o outro relatório para conciliar.')}</section>`}

async function openTemporaryView(){
  const fragment = location.hash;
  if(!fragment.startsWith('#consulta='))return;
  const token = fragment.slice('#consulta='.length);
  window.history.replaceState(null,'',location.pathname+location.search);
  view='panel';
  await request('/api/temporary-view',{token});
}
try{C=await request('/catalog.json');await refresh();setInterval(()=>{if(!dialog.open&&!busy&&!refreshInFlight)refresh().catch(()=>{})},3000)}catch(err){if(!session&&C){}else toast(err.message,true)}

if(typeof document.addEventListener==='function'){
 document.addEventListener('submit',ev=>{if(ev.target?.id==='panelAssistantForm'){ev.preventDefault();sendPanelChat()}});
 document.addEventListener('input',ev=>{if(ev.target?.id==='panelAssistantInput')assistantState.draft=ev.target.value});
 document.addEventListener('change',ev=>{
  if(ev.target?.id==='panelBoardStatus'){assistantState.boardStatus=ev.target.value;render()}
  if(ev.target?.id==='panelBoardOwner'){assistantState.boardOwner=ev.target.value;render()}
 });
}
