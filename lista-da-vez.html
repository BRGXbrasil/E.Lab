@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,wght@0,500;0,600;1,500;1,600&display=swap');
:root{--bg:#f6f2e9;--card:#fff;--ink:#1c1a16;--muted:#786f5c;--line:rgba(28,26,22,.1);--gold:#8a6a2f;--goldsoft:#f5eee1;--green:#477154;--red:#91514b;--purple:#7257a6}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.shell{max-width:1160px;margin:auto;padding:34px 24px 70px}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px}.eyebrow,.label{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}h1,h2,h3{font-family:Newsreader,serif;font-weight:600;letter-spacing:-.025em}h1{font-size:42px;margin:9px 0 8px}h2{font-size:28px;margin:0 0 6px}h3{font-size:20px;margin:0}.sub{font-size:13px;color:var(--muted);line-height:1.55;margin:0}.live{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:30px;padding:9px 13px;background:#fff}.live:before{content:'';display:inline-block;width:6px;height:6px;background:#5c8b63;border-radius:50%;margin-right:7px}.dept-tabs{display:flex;gap:7px;flex-wrap:wrap;margin:28px 0 14px}.pill{border:1px solid var(--line);background:transparent;border-radius:999px;padding:9px 14px;font-size:12px;color:var(--muted)}.pill.active{background:var(--ink);color:#fff;border-color:var(--ink)}.nav{display:flex;gap:8px;border-bottom:1px solid var(--line);padding-bottom:13px;margin-bottom:22px}.nav button{border:0;background:none;color:var(--muted);font-size:12px;padding:7px 9px}.nav button.active{color:var(--ink);font-weight:700;border-bottom:2px solid var(--gold)}.queues{display:grid;grid-template-columns:1fr 1fr;gap:18px}.panel{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px}.queue-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:17px}.queue-number{font-family:Newsreader,serif;font-size:36px;color:var(--gold);line-height:1}.queue-name{font-family:Newsreader,serif;font-size:29px;margin:6px 0}.queue-note{font-size:12px;color:var(--muted);line-height:1.5}.next{background:var(--goldsoft);border:1px solid #e8dac0;border-radius:15px;padding:14px;margin-bottom:13px}.next .label{font-size:9px}.next strong{display:block;font-family:Newsreader,serif;font-size:27px;margin:5px 0}.next small{font-size:10px;color:var(--muted)}.rows{display:flex;flex-direction:column}.row{display:flex;align-items:center;gap:11px;padding:12px 6px;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.rank{width:27px;height:27px;border-radius:50%;display:grid;place-items:center;background:#eee9df;color:var(--muted);font-size:11px;font-weight:700}.rank.first{background:var(--gold);color:#fff}.row-main{flex:1;min-width:0}.row-name{font-size:13px;font-weight:600}.row-meta{font-size:10px;color:var(--muted);margin-top:3px}.badge,.status{font-size:9px;letter-spacing:.07em;text-transform:uppercase;border-radius:20px;padding:6px 8px;white-space:nowrap}.badge.present,.status.confirmed{background:#e5efe7;color:var(--green)}.badge.busy{background:#eee9df;color:var(--muted)}.badge.returned{background:#f4ecd8;color:var(--gold)}.status.pending{background:#f4ecd8;color:var(--gold)}.status.due{background:#fff0e9;color:#a95e40}.status.missed{background:#f5e5e3;color:var(--red)}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.primary,.secondary,.danger{border-radius:11px;padding:10px 13px;font-size:11px;font-weight:600}.primary{border:0;background:var(--ink);color:#fff}.secondary{border:1px solid var(--line);background:#fff;color:var(--ink)}.danger{border:1px solid #e0b9b5;background:#fff8f7;color:var(--red)}.wide{grid-column:1/-1}.appointment-list{display:flex;flex-direction:column;gap:10px}.appointment{border:1px solid var(--line);border-radius:15px;padding:14px;background:#fff}.appointment-top{display:flex;justify-content:space-between;gap:12px}.appointment-name{font-size:13px;font-weight:700}.appointment-meta{font-size:11px;color:var(--muted);line-height:1.65;margin-top:4px}.appointment-actions{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:12px}.small{border:1px solid var(--line);border-radius:9px;background:#fff;padding:8px 10px;font-size:10px}.small.confirm{color:var(--green);border-color:#b8d0be;background:#f4faf5}.small.fail{color:var(--red);border-color:#e0b9b5;background:#fff8f7}.empty{font-size:12px;color:var(--muted);padding:15px 0}.history-row{display:flex;justify-content:space-between;gap:18px;padding:13px 0;border-bottom:1px solid var(--line);font-size:12px}.history-row:last-child{border-bottom:0}.history-row span{color:var(--muted);font-size:10px;text-align:right}.overlay{position:fixed;inset:0;background:rgba(28,26,22,.32);backdrop-filter:blur(10px);display:grid;place-items:center;padding:18px;z-index:5}.modal{background:#fff;border-radius:25px;width:min(850px,100%);max-height:min(92vh,850px);overflow:auto;box-shadow:0 24px 80px rgba(28,26,22,.2)}.modal-head{display:flex;justify-content:space-between;align-items:flex-start;padding:24px 25px 16px;border-bottom:1px solid var(--line)}.close{border:0;background:#f2efe9;width:32px;height:32px;border-radius:50%;font-size:18px;color:var(--muted)}.modal-body{padding:20px 25px}.stepper{display:flex;gap:8px;margin-bottom:19px}.step{font-size:10px;color:var(--muted);padding:7px 10px;border-radius:20px;background:#f4f1eb}.step.active{color:var(--ink);background:var(--goldsoft);font-weight:700}.section{padding:16px 0;border-bottom:1px solid var(--line)}.section:last-child{border-bottom:0}.section-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.field-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field-grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}.field label{display:block;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:11px;background:#fff;padding:11px;color:var(--ink);outline:0}.field textarea{min-height:72px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--gold)}.searchline{display:grid;grid-template-columns:140px 1fr auto;gap:8px}.search-result{display:flex;align-items:center;justify-content:space-between;border:1px solid #d9cbe9;background:#fbf9ff;border-radius:12px;padding:11px 13px;margin-top:9px}.client-name{font-weight:700;font-size:12px}.client-meta{font-size:10px;color:var(--muted);margin-top:3px}.tag-list{display:flex;flex-wrap:wrap;gap:7px}.tag{font-size:10px;padding:8px 10px;border-radius:9px;color:#fff}.tag.purple{background:#785cab}.tag.green{background:#4e8a67}.tag.blue{background:#4c78a8}.toggle{display:flex;gap:8px;align-items:center;font-size:11px;color:var(--muted)}.toggle input{accent-color:var(--purple)}.price{display:flex;justify-content:space-between;align-items:center;background:#f8f6f1;border-radius:13px;padding:13px 15px;margin-top:14px}.price strong{font-size:19px}.modal-footer{display:flex;justify-content:flex-end;gap:8px;padding:16px 25px;border-top:1px solid var(--line)}.hidden{display:none}.toast{position:fixed;bottom:20px;right:20px;background:var(--ink);color:#fff;padding:12px 15px;border-radius:12px;font-size:11px;z-index:8;box-shadow:0 10px 30px #0002}@media(max-width:800px){.queues{grid-template-columns:1fr}.wide{grid-column:auto}}@media(max-width:600px){.shell{padding:25px 15px 50px}.top{display:block}.live{display:inline-block;margin-top:16px}.field-grid,.field-grid.three{grid-template-columns:1fr}.searchline{grid-template-columns:1fr}.modal-body,.modal-head,.modal-footer{padding-left:18px;padding-right:18px}.appointment-top{display:block}.appointment-top .status{display:inline-block;margin-top:8px}}
</style>

<body>
<div class="shell"><header class="top"><div><div class="eyebrow">BRGS.app / listadavez</div><h1>Lista da Vez</h1><p class="sub">Distribuição de clientes com clareza para a recepção e previsibilidade para a equipe.</p></div><div class="live">Operação sincronizada</div></header><div class="dept-tabs" id="departments"></div><nav class="nav"><button id="navQueues" onclick="showTab('filas')">Duas filas</button><button id="navAppointments" onclick="showTab('agendamentos')">Agendamentos</button><button id="navHistory" onclick="showTab('historico')">Histórico</button></nav><main id="content"></main></div><div id="modalRoot"></div>
<script>
const departments=[['cab','Cabeleireiros'],['man','Manicure padrão'],['gel','Serviço de gel'],['sob','Sobrancelha / Make'],['make','Maquiagem']];
const seed={cab:[{name:'Evinho',present:false,attended:0},{name:'Allan',present:true,attended:1},{name:'Dani',present:true,attended:1},{name:'Luiza',present:true,attended:0}],man:[],gel:[],sob:[],make:[]};
const services=[{name:'Corte',duration:30,price:450},{name:'Glow',duration:90,price:800},{name:'Coloração',duration:120,price:650},{name:'Manicure',duration:60,price:180}];
const key='elab_lista_da_vez_v3';let db=JSON.parse(localStorage.getItem(key)||'null')||{dept:'cab',queues:seed,appointments:[],history:[],clients:[{name:'Diego Borges',phone:'(11) 9901-30811',cpf:'',birthday:'30/03',gender:'Masculino',email:'',notes:'Karina\nCafé com adoçante\nGosta de conversar\nPet Dalmata Junior\nGosta de 1922 Keune',tags:['CLIENTE NOVA · PACOTE 2.800']} ]};let activeTab='filas';let selectedClient=null;let selectedService=services[0];
function save(){localStorage.setItem(key,JSON.stringify(db))}function today(){return new Date().toISOString().slice(0,10)}function fmtDate(v){if(!v)return 'sem data';const [y,m,d]=v.split('-');return `${d}/${m}/${y}`}function deptName(){return departments.find(d=>d[0]===db.dept)?.[1]||'Cabeleireiros'}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function queue(id=db.dept){return db.queues[id]||[]}function due(a){return a.status==='agendado'&&a.date<=today()}
function renderDepartments(){document.getElementById('departments').innerHTML=departments.map(([id,name])=>`<button class="pill ${id===db.dept?'active':''}" onclick="selectDept('${id}')">${name}</button>`).join('')}
function selectDept(id){db.dept=id;save();render()}function showTab(tab){activeTab=tab;render()}function render(){renderDepartments();['Queues','Appointments','History'].forEach(x=>document.getElementById('nav'+x).classList.toggle('active',activeTab===({Queues:'filas',Appointments:'agendamentos',History:'historico'}[x])));if(activeTab==='filas')renderQueues();if(activeTab==='agendamentos')renderAppointments();if(activeTab==='historico')renderHistory()}
function renderQueues(){const q=queue(),immediate=q.filter(p=>p.present),ahead=db.appointments.filter(a=>a.dept===db.dept&&a.status==='agendado');document.getElementById('content').innerHTML=`<div class="queues"><section class="panel"><div class="queue-head"><div><div class="label">Fila 01 · Agora</div><div class="queue-name">Imediato</div><div class="queue-note">Próxima profissional disponível. Só entra quem está presente.</div></div><div class="queue-number">${immediate.length}</div></div>${nextCard(immediate[0],'Próxima profissional disponível',true)}${rows(q)}</section><section class="panel"><div class="queue-head"><div><div class="label">Fila 02 · Agenda</div><div class="queue-name">Antecipado</div><div class="queue-note">Reservas com data e horário. A recepção confere quando chegar o dia.</div></div><div class="queue-number">${ahead.length}</div></div>${ahead.length?ahead.slice(0,3).map(appointmentCard).join(''):'<div class="empty">Nenhum atendimento antecipado para este departamento.</div>'}<div class="actions"><button class="primary" onclick="openAppointment('antecipado')">+ Agendar antecipado</button><button class="secondary" onclick="showTab('agendamentos')">Ver agenda</button></div><div class="notice">Na Fila 02, se a data passar e o atendimento não for confirmado, o operador encerra como <b>não realizado</b> e a profissional retorna à fila sem duplicidade. Na Fila 01, <b>Passar para o próximo</b> significa perder a vez.</div></section></div>`}
function nextCard(p,label,canPass=false){return p?`<div class="next"><div class="label">${label}</div><strong>${esc(p.name)}</strong><small>Presente · ${p.attended||0} atendimento(s)</small>${canPass?'<div class="actions"><button class="secondary" onclick="passImmediate()">Passar para o próximo · Perde a vez</button></div>':''}</div>`:'<div class="empty">Nenhuma profissional disponível no momento.</div>'}
function rows(q){return `<div class="rows">${q.length?q.map((p,i)=>`<div class="row"><div class="rank ${i===0?'first':''}">${i+1}</div><div class="row-main"><div class="row-name">${esc(p.name)}</div><div class="row-meta">${p.attended||0} atendimento(s)${p.returned?' · voltou por perda de agendamento':''}</div></div><span class="badge ${p.returned?'returned':p.present?'present':'busy'}">${p.returned?'retornada':p.present?'presente':'ocupada'}</span></div>`).join(''):'<div class="empty">Nenhuma profissional cadastrada nesta fila.</div>'}</div>`}
function renderAppointments(){const list=db.appointments.filter(a=>a.dept===db.dept).sort((a,b)=>b.date.localeCompare(a.date)||b.start.localeCompare(a.start));document.getElementById('content').innerHTML=`<section class="panel"><div class="queue-head"><div><div class="label">Agenda da vez · ${deptName()}</div><h2>Agendamentos</h2><p class="sub">A data e o horário ficam visíveis antes da conferência operacional.</p></div><div class="queue-number">${list.filter(a=>a.status==='agendado').length}</div></div>${list.length?`<div class="appointment-list">${list.map(appointmentCard).join('')}</div>`:'<div class="empty">Nenhum agendamento registrado.</div>'}<div class="actions"><button class="primary" onclick="openAppointment('antecipado')">+ Novo agendamento</button></div></section>`}
function appointmentCard(a){let action=a.status==='agendado'?(due(a)?`<button class="small confirm" onclick="confirmAppointment('${a.id}')">Confirmado / realizado</button>${a.kind==='antecipado'?`<button class="small fail" onclick="missAppointment('${a.id}')">Não realizado · devolver à fila</button>`:''}`:`<span class="status pending">Agendado · aguarda a data</span>`):a.status==='confirmado'?'<span class="status confirmed">Confirmado</span>':'<span class="status missed">Não realizado · encerrado</span>';return `<article class="appointment"><div class="appointment-top"><div><div class="appointment-name">${esc(a.client)}</div><div class="appointment-meta"><b>${esc(a.professional)}</b> · ${fmtDate(a.date)} · ${a.start}–${a.end}<br>${esc(a.service)} · ${a.duration} min · R$ ${a.price.toFixed(2).replace('.',',')}</div></div>${due(a)?'<span class="status due">Conferência pendente</span>':''}</div><div class="appointment-actions">${action}</div></article>`}
function renderHistory(){document.getElementById('content').innerHTML=`<section class="panel"><div class="queue-head"><div><div class="label">Rastreabilidade operacional</div><h2>Histórico</h2><p class="sub">As decisões da recepção permanecem registradas.</p></div></div>${db.history.length?db.history.map(h=>`<div class="history-row"><div>${esc(h.text)}</div><span>${esc(h.detail)}<br>${new Date(h.at).toLocaleString('pt-BR')}</span></div>`).join(''):'<div class="empty">Ainda não há movimentações.</div>'}</section>`}
function openAppointment(type){
  selectedService=services[0];
  const people=queue();
  document.getElementById('modalRoot').innerHTML=`<div class="overlay" onclick="closeIfOutside(event)"><div class="modal"><div class="modal-head"><div><div class="label">Fila 02 · Antecipado</div><h2>Novo agendamento</h2><p class="sub">Informe os dados essenciais para reservar a vez.</p></div><button class="close" onclick="closeModal()">×</button></div><div class="modal-body"><div class="section"><div class="section-title"><h3>Dados do atendimento</h3><span class="label">${deptName()}</span></div><div class="field-grid"><div class="field"><label>Cliente</label><input id="clientName" placeholder="Nome da cliente" autofocus></div><div class="field"><label>Serviço</label><select id="service" onchange="changeService()">${services.map((s,i)=>`<option value="${i}">${s.name} · ${s.duration} min</option>`).join('')}</select></div><div class="field"><label>Profissional</label><select id="professional">${people.map(p=>`<option>${esc(p.name)}</option>`).join('')}</select></div><div class="field"><label>Data</label><input id="appointmentDate" type="date" value="${today()}" min="${today()}"></div><div class="field"><label>Horário de início</label><input id="start" type="time" value="12:30" onchange="updateEnd()"></div><div class="field"><label>Horário de fim</label><input id="end" type="time" value="13:00"></div></div><div class="price"><span>Total estimado<small style="display:block;color:var(--muted);margin-top:4px"><span id="duration">30</span> minutos · <span id="serviceSummary">Corte</span></small></span><strong id="price">R$ 450,00</strong></div></div><div class="section"><div class="notice">Depois da data, o agendamento ficará como <b>Conferência pendente</b>. A recepção poderá confirmar o atendimento ou marcar <b>Não realizado</b> para devolver a profissional à fila.</div></div></div><div class="modal-footer"><button class="secondary" onclick="closeModal()">Cancelar</button><button class="primary" onclick="saveAppointment('antecipado')">Confirmar agendamento</button></div></div></div>`;
}
function clientResult(){return selectedClient?`<div class="search-result"><div><div class="client-name">${esc(selectedClient.name)}</div><div class="client-meta">${esc(selectedClient.phone||'Sem telefone')} · ${esc(selectedClient.gender||'Perfil cadastrado')}</div></div><button class="secondary" onclick="openClient()">Editar</button></div>`:''}
function searchClient(){const term=(document.getElementById('searchClient')?.value||'').toLowerCase();const found=db.clients.find(c=>Object.values(c).some(v=>String(v).toLowerCase().includes(term)));if(found)selectedClient=found;document.getElementById('clientResult').innerHTML=found?clientResult():'<div class="empty">Nenhuma cliente encontrada. Use “Novo cliente” para cadastrar.</div>'}
function changeService(){selectedService=services[Number(document.getElementById('service').value)];document.getElementById('price').textContent='R$ '+selectedService.price.toFixed(2).replace('.',',');document.getElementById('duration').textContent=selectedService.duration;document.getElementById('serviceSummary').textContent=selectedService.name;updateEnd()}
function updateEnd(){const start=document.getElementById('start')?.value;if(!start)return;const [h,m]=start.split(':').map(Number),total=h*60+m+selectedService.duration;document.getElementById('end').value=String(Math.floor(total/60)%24).padStart(2,'0')+':'+String(total%60).padStart(2,'0')}
function openClient(){const c=selectedClient||{};document.getElementById('modalRoot').insertAdjacentHTML('beforeend',`<div class="overlay" id="clientModal" onclick="closeClientOutside(event)"><div class="modal"><div class="modal-head"><div><div class="label">Cadastro e anamnese</div><h2>${c.name?'Editar cliente':'Novo cliente'}</h2><p class="sub">Informações que ajudam a equipe a atender com familiaridade.</p></div><button class="close" onclick="closeClient()">×</button></div><div class="modal-body"><div class="section"><div class="field-grid"><div class="field"><label>Nome</label><input id="cName" value="${esc(c.name||'')}"></div><div class="field"><label>Data de aniversário</label><input id="cBirthday" placeholder="30/03" value="${esc(c.birthday||'')}"></div><div class="field"><label>Gênero</label><select id="cGender"><option ${c.gender==='Feminino'?'selected':''}>Feminino</option><option ${c.gender==='Masculino'?'selected':''}>Masculino</option><option>Não informar</option></select></div><div class="field"><label>Telefone</label><input id="cPhone" placeholder="(11) 99999-9999" value="${esc(c.phone||'')}"></div><div class="field"><label>CPF</label><input id="cCpf" value="${esc(c.cpf||'')}"></div><div class="field"><label>E-mail</label><input id="cEmail" value="${esc(c.email||'')}"></div></div></div><div class="section"><div class="field-grid three"><div class="field"><label>CEP</label><input placeholder="00000-000"></div><div class="field"><label>Endereço</label><input placeholder="Rua"></div><div class="field"><label>Número</label><input placeholder="000"></div><div class="field"><label>Bairro</label><input placeholder="Bairro"></div><div class="field"><label>Cidade</label><input placeholder="Rio de Janeiro"></div><div class="field"><label>Estado</label><select><option>Rio de Janeiro</option><option>São Paulo</option><option>Minas Gerais</option></select></div></div></div><div class="section"><div class="field"><label>Observações / anamnese</label><textarea id="cNotes" placeholder="Preferências, hábitos e informações importantes">${esc(c.notes||'')}</textarea></div><div class="field-grid" style="margin-top:12px"><div class="field"><label>Como conheceu</label><select><option>Indicação</option><option>Instagram</option><option>Google</option></select></div><div class="field"><label>Profissão</label><input placeholder="Ex.: Gerente"></div></div><div class="tag-list" style="margin-top:13px"><span class="tag purple">CLIENTE NOVA</span><span class="tag green">PACOTE ATIVO</span></div></div><div class="section"><label class="toggle"><input type="checkbox"> Campanhas de e-mail</label><label class="toggle"><input type="checkbox"> Agendamento online</label><label class="toggle"><input type="checkbox" checked> Atendimento por IA</label><label class="toggle"><input type="checkbox" checked> Campanhas de WhatsApp</label></div></div><div class="modal-footer"><button class="secondary" onclick="closeClient()">Cancelar</button><button class="primary" onclick="saveClient()">Salvar anamnese</button></div></div></div>`)}
function saveClient(){const c={...(selectedClient||{}),name:document.getElementById('cName').value.trim()||'Cliente sem nome',birthday:document.getElementById('cBirthday').value,gender:document.getElementById('cGender').value,phone:document.getElementById('cPhone').value,cpf:document.getElementById('cCpf').value,email:document.getElementById('cEmail').value,notes:document.getElementById('cNotes').value};if(!selectedClient)db.clients.push(c);selectedClient=c;save();closeClient();const result=document.getElementById('clientResult');if(result)result.innerHTML=clientResult();const notes=document.getElementById('notesPreview');if(notes)notes.textContent=c.notes||'Nenhuma observação registrada.';toast('Anamnese salva')}
function saveAppointment(type){const client=document.getElementById('clientName')?.value.trim(),professional=document.getElementById('professional')?.value,date=document.getElementById('appointmentDate')?.value,start=document.getElementById('start')?.value,end=document.getElementById('end')?.value;if(!client||!professional||!date||!start||!end){toast('Preencha cliente, profissional, data e horário');return}const a={id:crypto.randomUUID(),dept:db.dept,kind:type,client,professional,date,start,end,service:selectedService.name,duration:selectedService.duration,price:selectedService.price,status:'agendado',createdAt:new Date().toISOString(),recurring:document.getElementById('recurring')?.checked||false};db.appointments.push(a);db.history.unshift({text:`Agendamento criado · ${client}`,detail:`${professional} · ${fmtDate(date)} ${start} · ${type==='imediato'?'Imediato':'Antecipado'}`,at:new Date().toISOString()});save();closeModal();showTab('agendamentos');toast('Agendamento salvo')}
function passImmediate(){const q=queue(),index=q.findIndex(p=>p.present);if(index<0){toast('Nenhuma profissional disponível para passar');return}const [p]=q.splice(index,1);p.passedAt=new Date().toISOString();q.push(p);db.history.unshift({text:`${p.name} passou a vez`,detail:`Fila 01 · Imediato · perdeu a vez`,at:new Date().toISOString()});save();render();toast(`${p.name} perdeu a vez e foi para o fim da fila`)}
function confirmAppointment(id){const a=db.appointments.find(x=>x.id===id);if(!a)return;a.status='confirmado';db.history.unshift({text:`${a.client} confirmado`,detail:`${a.professional} · ${fmtDate(a.date)} ${a.start}`,at:new Date().toISOString()});save();render()}
function missAppointment(id){const a=db.appointments.find(x=>x.id===id);if(!a||a.status!=='agendado'||a.kind!=='antecipado')return;const q=queue(a.dept),p=q.find(x=>x.name===a.professional);if(p){p.returned=true;p.returnedFrom=a.id}else q.push({name:a.professional,present:true,attended:0,returned:true,returnedFrom:a.id});a.status='nao_realizado';a.closedAt=new Date().toISOString();db.history.unshift({text:`${a.client} não realizado`,detail:`${a.professional} voltou à Fila 01 · ${fmtDate(a.date)}`,at:a.closedAt});save();showTab('filas');toast('Profissional devolvida à fila')}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}function closeIfOutside(e){if(e.target.classList.contains('overlay'))closeModal()}function closeClient(){document.getElementById('clientModal')?.remove()}function closeClientOutside(e){if(e.target.id==='clientModal')closeClient()}function toast(text){const t=document.createElement('div');t.className='toast';t.textContent=text;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}
render();
</script>
